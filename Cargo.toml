[package]
name = "gipm"
version = "0.2.1"
edition = "2024"
description = "Gipm is a git package manager"
license = "MIT"
homepage = "https://github.com/gipm-rs/gipm"
repository = "https://github.com/gipm-rs/gipm"

[lib]
path = "src/lib.rs"

[features]
serde = ["pubgrub/serde", "semver/serde"]

[dependencies]
gix = { version = "^0.89.0", features = ["blocking-http-transport-reqwest-rust-tls", "progress-tree"]}
anyhow = "^1.0"
tokio = { version = "^1.0", features = ["full"] }
serde = { version = "^1.0", features = ["derive"] }
serde_yaml = "^0.9"
semver = { version = "^1.0", features = ["serde"] }
regex = "^1.10"
pubgrub = "^0.4"
url = "^2.5"
rayon = "^1"
once_cell = "^1.21"
log = "^0.4"
crossterm = "^0.29"
chrono = { version = "^0.4", features = ["serde"] }
toml = "^1.1"
clap = { version = "^4.0", features = ["derive"] }
prodash = { version = "^31.0.1", features = ["progress-tree"] }
indicatif = { version = "^0.18", features = ["in_memory"] }
console = "^0.16"

# For semver_pubgrub
zerocopy = { version = "0.8.14", features = ["derive"] }

[dev-dependencies]
gipm = { path = "." }

[[test]]
name = "test_lockfile"
path = "tests/test_lockfile.rs"

[[test]]
name = "test_update"
path = "tests/update/test_update.rs"

[[test]]
name = "test_sync"
path = "tests/sync/test_sync.rs"

[[test]]
name = "test_clean"
path = "tests/clean/test_clean.rs"

[[test]]
name = "test_submodule"
path = "tests/submodule/test_submodule.rs"

[[test]]
name = "test_failure"
path = "tests/failure/test_failure.rs"

[[test]]
name = "test_branches"
path = "tests/branches/test_branches.rs"

[[test]]
name = "test_cache"
path = "tests/cache/test_cache.rs"

[[test]]
name = "test_cli"
path = "tests/cli/test_cli.rs"

[[test]]
name = "test_manifest"
path = "tests/manifest/test_manifest.rs"

[[test]]
name = "test_drift"
path = "tests/drift/test_drift.rs"

[[test]]
name = "test_broken"
path = "tests/broken/test_broken.rs"


[[test]]
name = "test_upstream"
path = "tests/upstream/test_upstream.rs"
[[test]]
name = "test_network"
path = "tests/network/test_network.rs"

[[test]]
name = "test_pty"
path = "tests/pty/test_pty.rs"

[[test]]
name = "test_diamond"
path = "tests/diamond/test_diamond.rs"
