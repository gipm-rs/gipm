[package]
name = "gipm"
version = "0.2.1"
edition = "2024"
description = "Gipm is a git package manager"
license = "MIT"
homepage = "https://github.com/gipm-rs/gipm"
repository = "https://github.com/gipm-rs/gipm"

[lib]
path = "src/lib.rs"

[features]
serde = ["pubgrub/serde", "semver/serde"]

[dependencies]
gix = { version = "^0.89.0", features = ["blocking-http-transport-reqwest-rust-tls", "progress-tree"]}
anyhow = "^1.0"
tokio = { version = "^1.0", features = ["full"] }
serde = { version = "^1.0", features = ["derive"] }
serde_yaml = "^0.9"
semver = { version = "^1.0", features = ["serde"] }
regex = "^1.10"
pubgrub = "^0.4"
url = "^2.5"
rayon = "^1"
once_cell = "^1.21"
log = "^0.4"
crossterm = "^0.29"
chrono = { version = "^0.4", features = ["serde"] }
toml = "^1.1"
clap = { version = "^4.0", features = ["derive"] }
prodash = { version = "^31.0.1", features = ["progress-tree"] }
indicatif = { version = "^0.18", features = ["in_memory"] }
console = "^0.16"

# For semver_pubgrub
zerocopy = { version = "0.8.14", features = ["derive"] }

[dev-dependencies]
gipm = { path = "." }

[[test]]
name = "test_lockfile"
path = "tests/test_lockfile.rs"

[[test]]
name = "test_update"
path = "tests/update/test_update.rs"

[[test]]
name = "test_sync"
path = "tests/sync/test_sync.rs"

[[test]]
name = "test_clean"
path = "tests/clean/test_clean.rs"
